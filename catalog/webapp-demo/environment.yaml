name: webapp-demo
version: 1.0.0
summary: Deploy a governed App Service web application environment.
description: App Service plan, web app, monitoring, managed identity, and optional storage.
runner: ARM
templatePath: main.bicep

parameters:
  - id: environmentName
    name: Environment Name
    description: Name for this environment deployment.
    type: string
    default: webapp-demo

  - id: appServicePlanSku
    name: App Service Plan SKU
    description: Azure App Service Plan pricing tier.
    type: string
    default: Basic
    allowed:
      - Basic
      - Standard
      - Premium

  - id: webAppRuntime
    name: Web App Runtime
    description: Runtime stack for the web app.
    type: string
    default: NODE|18-lts
    allowed:
      - NODE|18-lts
      - DOTNETCORE|7.0
      - PYTHON|3.11

  - id: enableStorage
    name: Enable Storage
    description: Create an optional Azure Storage Account.
    type: boolean
    required: false
    default: true

  - id: environment
    name: Environment Type
    description: Deployment environment.
    type: string
    default: dev
    allowed:
      - dev
      - staging
      - prod

  - id: costCenter
    name: Cost Center
    description: Cost center code for billing.
    type: string
    required: false
    default: engineering

  - id: department
    name: Department
    description: Department owning this environment.
    type: string
    required: false
    default: platform-engineering
