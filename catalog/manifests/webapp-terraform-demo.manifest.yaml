id: webapp-terraform-demo
version: 1.1.0
status: approved
owners:
  platform: platform-engineering
  business: app-platform-shared
description: Approved Linux App Service pattern using Terraform with Free SKU support.
source:
  repository: <GITHUB_OR_AZURE_REPOS_REPO_URL>
  path: catalog/webapp-terraform-demo
artifacts:
  template:
    type: terraform
    path: catalog/webapp-terraform-demo/main.tf
  environmentDefinition:
    path: catalog/webapp-terraform-demo/environment.yaml
inputs:
  required:
    - environment_name
    - resource_group_name
    - location
    - app_service_plan_sku
  optional:
    - enable_storage
    - env_type
    - department
    - cost_center
validation:
  commands:
    - terraform -chdir=catalog/webapp-terraform-demo init -backend=false
    - terraform -chdir=catalog/webapp-terraform-demo validate
governance:
  codeownersRequired: true
  requiredApprovers:
    - platform-engineering
  rbacPlaceholders:
    - Contributor
  policyPlaceholders:
    - policies/azure-policy-assignment.placeholder.json
promotion:
  path:
    - candidate
    - approved
    - promoted
  criteria:
    - validation-passed
    - security-review-passed
    - platform-owner-approved
